[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dasp-nids"
version = "0.1.0"
description = "Layer-wise continual adaptation experiments for network intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
river = ["river>=0.25,<0.26"]

[project.scripts]
dasp-nids = "dasp_nids.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
